<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telecomando">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Telecomando VolleyLive</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#0f1722; --muted:#5b6778; --line:#d5dce5;
  --accent:#1f6feb; --accent-fg:#ffffff; --ok:#1a7f37; --bad:#c62828; --warn:#9a6700;
  --teamA:#2f6fed; --teamB:#e8590c;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--muted:#8b97a6;--line:#2a323d;--accent:#4c8dff;--accent-fg:#06101f;--ok:#3fb950;--bad:#ff7b7b;--warn:#d29922}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
main{max-width:560px;margin:0 auto;display:grid;gap:12px;min-height:calc(100vh - 28px);grid-template-rows:auto auto auto auto 1fr auto auto}
p{margin:0}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:34px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.pill[data-s="ok"] .dot{background:var(--ok)} .pill[data-s="warn"] .dot{background:var(--warn)} .pill[data-s="bad"] .dot{background:var(--bad)}
.set{color:var(--muted);font-size:.9rem;text-align:right}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;border-top:6px solid var(--c,var(--line));display:grid;gap:2px;min-width:0}
.team .nm{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .pts{font-size:min(22vw,5.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.team .sub{font-size:.8rem;color:var(--muted)}
.team .srv::before{content:"● ";color:#f5a623}
.status{text-align:center;font-weight:600;min-height:1.4em}
.recent{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--card);border-left:5px solid var(--c,var(--line))}
.chip.doubt{border-color:var(--warn)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.pad{display:grid;gap:10px;align-content:end}
button{
  font:inherit;font-weight:600;min-height:52px;padding:0 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.4}
button.big{min-height:clamp(84px,17vh,128px);font-size:1.4rem;font-weight:800;color:#fff;border:0;display:grid;place-content:center;gap:2px}
button.big small{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
button.big.a{background:var(--teamA)} button.big.b{background:var(--teamB)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start}
button.mini{min-height:38px;font-size:.95rem;border-radius:10px}
button.end{border-color:var(--bad);color:var(--bad)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.four button{font-size:.92rem;padding:0 4px;line-height:1.1}
.opts{display:flex;justify-content:center}
.opts label{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}
.toast{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);max-width:92vw;background:#000c;color:#fff;border-radius:999px;padding:10px 16px;font-size:.92rem;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;-webkit-user-select:auto;user-select:auto}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 10px;width:100%;letter-spacing:.08em}
input.relay{letter-spacing:0}
.hint{color:var(--muted);font-size:.85rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
[hidden]{display:none!important}
@media (orientation:landscape) and (max-height:480px){
  .toast{top:auto;bottom:10px;transform:translateX(-50%)}
  main{max-width:900px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto 1fr;min-height:0;align-items:start}
  .top,.status,.recent,.empty{grid-column:1/-1}
}
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <span class="pill" id="conn" data-s="warn"><span class="dot"></span><span id="connTxt">Mi collego…</span></span>
    <span class="set" id="setTxt"></span>
  </div>

  <form id="join" hidden>
    <b>Collega il telecomando</b>
    <p class="hint">Apri il link che ti manda il telefono con la camera, oppure scrivi qui il codice che trovi nella sua scheda «⋯ Altro».</p>
    <label class="f">Codice<input type="text" id="jCode" placeholder="ABCD-2345" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" maxlength="12"></label>
    <label class="f" id="jRelayRow">Indirizzo del servizio<input type="text" id="jRelay" class="relay" placeholder="wss://volleylive-relay.…workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <p class="err" id="jErr" role="alert"></p>
    <button class="primary" type="submit">Collega</button>
  </form>

  <div class="board" id="board" hidden>
    <div class="team" id="tA"><span class="nm" id="nA">—</span><span class="pts" id="pA">0</span><span class="sub" id="sA"></span></div>
    <div class="team" id="tB"><span class="nm" id="nB">—</span><span class="pts" id="pB">0</span><span class="sub" id="sB"></span></div>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="recent" id="recent"></div>
  <div class="empty" id="empty" hidden></div>

  <div class="pad" id="pad" hidden>
    <div class="two">
      <div class="col">
        <button class="big a" id="bA"><span>+1</span><small id="bAn"></small></button>
        <button class="mini" id="bSubA" aria-label="Togli un punto alla squadra A">−1</button>
      </div>
      <div class="col">
        <button class="big b" id="bB"><span>+1</span><small id="bBn"></small></button>
        <button class="mini" id="bSubB" aria-label="Togli un punto alla squadra B">−1</button>
      </div>
    </div>
    <div class="four">
      <button class="primary" id="bVia">Via</button>
      <button id="bScore">Punteggio</button>
      <button id="bUndo">Annulla</button>
      <button class="end" id="bEnd">Fine partita</button>
    </div>
    <div class="opts"><label><input type="checkbox" id="auto"> Punti automatici</label></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>
<script type="module" src="telecomando.js"></script>
</body>
</html>
