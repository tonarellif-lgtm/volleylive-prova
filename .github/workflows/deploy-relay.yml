# Installa (e aggiorna) il relay del telecomando su Cloudflare Workers.
# Serve il segreto CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nelle impostazioni del repository (vedi relay/README.md).
# Senza i segreti il lavoro finisce senza errori e spiega cosa manca.
name: Installa il relay del telecomando

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'

concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i segreti
        id: chk
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Relay non installato"
              echo
              echo "Mancano i segreti del repository **CLOUDFLARE_API_TOKEN** e/o **CLOUDFLARE_ACCOUNT_ID**."
              echo "Si aggiungono in Settings → Secrets and variables → Actions → New repository secret (istruzioni in relay/README.md)."
              echo "Poi: Actions → «Installa il relay del telecomando» → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Installa i pacchetti
        if: steps.chk.outputs.ready == 'true'
        working-directory: relay
        run: npm ci --no-audit --no-fund

      - name: Controlla il codice
        if: steps.chk.outputs.ready == 'true'
        working-directory: relay
        run: |
          node --check room.js
          node --check worker.js
          node --check server.mjs

      - name: Installa su Cloudflare
        if: steps.chk.outputs.ready == 'true'
        working-directory: relay
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          {
            echo "### Relay installato"
            echo
            if [ -n "$url" ]; then
              echo "Indirizzo da scrivere nel campo «Indirizzo del servizio» del telefono con la camera:"
              echo
              echo '```'
              echo "wss://${url#https://}"
              echo '```'
            else
              echo "Installato, ma non trovo l'indirizzo nel registro: guardalo nel passaggio «Installa su Cloudflare» (https://….workers.dev) e metti wss:// davanti."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
